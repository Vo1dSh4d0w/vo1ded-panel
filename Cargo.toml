[package]
name = "vo1ded-panel"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
clap = { version = "4.6.9", features = ["derive"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
gtk4-layer-shell = "0.8.1"
pipewire = "0.10.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
system-tray = "0.8.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
glib-build-tools = "0.22"
